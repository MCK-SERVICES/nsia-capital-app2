name: Construire l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restaurer la clé de signature
        run: base64 -d app/nsia-release.jks.b64 > app/nsia-release.jks

      - name: Compiler l'APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk NSIA-Capital.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NSIA-Capital-apk
          path: NSIA-Capital.apk

      - name: Publier dans Releases (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NSIA Capital v1.0.${{ github.run_number }}
          body: Ouvre ce lien sur ton téléphone et touche NSIA-Capital.apk pour l'installer.
          files: NSIA-Capital.apk
